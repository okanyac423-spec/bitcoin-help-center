<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Admin</title>
<style>body{font-family:system-ui;margin:0;background:#f6f6f7}.box{max-width:900px;margin:35px auto;padding:25px}.msg{background:white;border:1px solid #ddd;border-radius:10px;padding:18px;margin:12px 0}.clear{padding:10px 15px;border:0;border-radius:7px;background:#222;color:#fff}</style></head>
<body><div class="box"><h1>Support Admin</h1><p>This demo dashboard reads messages saved in this browser only.</p><button class="clear" onclick="localStorage.removeItem('bhc_messages');location.reload()">Clear messages</button><div id="list"></div>
<script>const a=JSON.parse(localStorage.getItem('bhc_messages')||'[]').reverse();document.getElementById('list').innerHTML=a.length?a.map(x=>`<div class="msg"><b>${x.name}</b><br>${x.contact||'No contact provided'}<p>${x.message}</p><small>${x.time}</small></div>`).join(''):'<p>No messages yet.</p>';</script></div></body></html>
